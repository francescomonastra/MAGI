<!doctype html>
<html><head><meta charset="utf-8"><title>MAGI routing circuit -- mix_Small</title>
<style>
:root {
  --circuit-text: #1a1a18; --circuit-text-2: #5f5e5a; --circuit-text-3: #888780;
  --circuit-border: #d3d1c7; --circuit-border-strong: #b4b2a9;
  --circuit-surface-1: #f1efe8; --circuit-accent: #7f77dd;
  --circuit-teal-50: #e1f5ee; --circuit-teal-600: #0f6e56; --circuit-teal-800: #085041;
  --circuit-purple-50: #eeedfe; --circuit-purple-400: #7f77dd; --circuit-purple-800: #3c3489;
  --circuit-gray-50: #f1efe8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --circuit-text: #f1efe8; --circuit-text-2: #b4b2a9; --circuit-text-3: #888780;
    --circuit-border: #444441; --circuit-border-strong: #5f5e5a;
    --circuit-surface-1: #2c2c2a; --circuit-accent: #afa9ec;
    --circuit-teal-50: #085041; --circuit-teal-600: #5dcaa5; --circuit-teal-800: #e1f5ee;
    --circuit-purple-50: #26215c; --circuit-purple-400: #afa9ec; --circuit-purple-800: #cecbf6;
    --circuit-gray-50: #2c2c2a;
  }
}
.magi-circuit { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 720px;
  margin: 0 auto; color: var(--circuit-text); }
.magi-circuit svg text { fill: var(--circuit-text); font-size: 12px; }
.magi-circuit svg text.mc-t2 { fill: var(--circuit-text-2); font-size: 11px; }
.magi-circuit .mc-teal rect, .magi-circuit .mc-teal circle { fill: var(--circuit-teal-50); stroke: var(--circuit-teal-600); }
.magi-circuit .mc-teal text { fill: var(--circuit-teal-800); }
.magi-circuit .mc-purple rect { fill: var(--circuit-purple-50); stroke: var(--circuit-purple-400); }
.magi-circuit .mc-purple text { fill: var(--circuit-purple-800); }
.magi-circuit .mc-gray rect { fill: var(--circuit-gray-50); stroke: var(--circuit-border-strong); }
.magi-circuit button.mc-btn { display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 6px 14px; font: inherit; font-size: 13px; font-weight: 500;
  color: var(--circuit-text); background: transparent; cursor: pointer;
  border: 0.5px solid var(--circuit-border); border-radius: 8px; }
.magi-circuit button.mc-btn:hover { background: var(--circuit-surface-1); }
.magi-circuit button.mc-btn span.mc-sub { font-size: 10px; font-weight: 400; color: var(--circuit-text-2); }
.magi-circuit .mc-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 1.25rem; }
.magi-circuit .mc-legend { display: flex; gap: 16px; justify-content: center; font-size: 11px;
  color: var(--circuit-text-2); margin-top: 0.5rem; }
</style></head>
<body>
<div class="magi-circuit">
<div class="mc-row"><button class="mc-btn" data-idx="0"><span>gamma</span><span class="mc-sub">99.27% of events</span></button><button class="mc-btn" data-idx="1"><span>e-</span><span class="mc-sub">0.73% of events</span></button></div>

<svg viewBox="0 0 680 498" role="img" style="width:100%; height:auto;">
<title>MAGI routing circuit -- mix_Small</title>
<desc>One-hot particle type feeds the learned coupling prior and the decoder;
the decoder's gate routes each event to the continuum or a pinned spectral
line, with routing weights that differ by particle type.</desc>
<defs><marker id="mc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--circuit-text-3)"></path></marker></defs>
<text x="340.0" y="14" class="mc-t2" text-anchor="middle">one-hot condition c</text>
<g id="cell-0" class="mc-purple"><rect x="262.0" y="22" width="74" height="36" rx="4"></rect><text x="299.0" y="44.0" text-anchor="middle">gamma</text></g><g id="cell-1" class="mc-purple"><rect x="344.0" y="22" width="74" height="36" rx="4"></rect><text x="381.0" y="44.0" text-anchor="middle">e-</text></g>
<path id="wire-0" d="M299.0,58 L299.0,76 L340.0,86" fill="none" stroke="var(--circuit-border)" stroke-width="1"></path><path id="wire-1" d="M381.0,58 L381.0,76 L340.0,86" fill="none" stroke="var(--circuit-border)" stroke-width="1"></path>
<path d="M340.0,86 L340.0,96" fill="none"
stroke="var(--circuit-border-strong)" stroke-width="1" marker-end="url(#mc-arr)"></path>
<g class="mc-teal"><rect x="260.0" y="96" width="160" height="46" rx="4"></rect>
<text x="340.0" y="115.0" text-anchor="middle">prior</text>
<text x="340.0" y="131.0" text-anchor="middle" class="mc-t2">p(z | c, zone)</text></g>
<path d="M340.0,142 L340.0,154" fill="none"
stroke="var(--circuit-border-strong)" stroke-width="1" marker-end="url(#mc-arr)"></path>
<g class="mc-teal"><circle cx="340.0" cy="170.0" r="15"></circle>
<text x="340.0" y="175.0" text-anchor="middle">z</text></g>
<path d="M340.0,185 L340.0,197" fill="none"
stroke="var(--circuit-border-strong)" stroke-width="1" marker-end="url(#mc-arr)"></path>
<g class="mc-teal"><rect x="250.0" y="197" width="180" height="42" rx="4"></rect>
<text x="340.0" y="215.0" text-anchor="middle">decoder</text>
<text x="340.0" y="231.0" text-anchor="middle" class="mc-t2">[z, c] → outputs</text></g>
<path d="M280.0,239 C280.0,262 170.0,262 170.0,282" fill="none" stroke="var(--circuit-border-strong)" stroke-width="1" marker-end="url(#mc-arr)"></path>
<path d="M400.0,239 C400.0,262 400.0,262 400.0,268" fill="none" stroke="var(--circuit-border-strong)" stroke-width="1" marker-end="url(#mc-arr)"></path>
<g class="mc-gray"><rect x="80.0" y="282" width="180" height="44" rx="4"></rect>
<text x="170.0" y="300.0" text-anchor="middle">geometry heads</text>
<text x="170.0" y="316.0" text-anchor="middle" class="mc-t2">u_r, u_v, φ_r, φ_v</text></g>
<g class="mc-teal"><rect x="340.0" y="268" width="120" height="40" rx="4"></rect>
<text x="400.0" y="292.0" text-anchor="middle">gate g(z,c)</text></g>
<path d="M340.0,308 C340.0,332 185.0,332 185.0,336.0" fill="none" stroke="var(--circuit-border-strong)" stroke-width="1" marker-end="url(#mc-arr)"></path><path d="M340.0,308 C340.0,332 340.0,332 340.0,336.0" fill="none" stroke="var(--circuit-border-strong)" stroke-width="1" marker-end="url(#mc-arr)"></path><path d="M340.0,308 C340.0,332 495.0,332 495.0,336.0" fill="none" stroke="var(--circuit-border-strong)" stroke-width="1" marker-end="url(#mc-arr)"></path><path d="M340.0,308 C340.0,332 340.0,332 340.0,402.0" fill="none" stroke="var(--circuit-border-strong)" stroke-width="1" marker-end="url(#mc-arr)"></path>
<g id="leaf-0" class="mc-gray"><rect x="115.0" y="336.0" width="140" height="52" rx="4"></rect><text x="185.0" y="356.0" text-anchor="middle">continuum</text><text id="pct-0" x="185.0" y="374.0" text-anchor="middle" class="mc-t2">-</text></g><g id="leaf-1" class="mc-purple"><rect x="270.0" y="336.0" width="140" height="52" rx="4"></rect><text x="340.0" y="356.0" text-anchor="middle">line @ 511.00 keV</text><text id="pct-1" x="340.0" y="374.0" text-anchor="middle" class="mc-t2">-</text></g><g id="leaf-2" class="mc-purple"><rect x="425.0" y="336.0" width="140" height="52" rx="4"></rect><text x="495.0" y="356.0" text-anchor="middle">line @ 1.47 keV</text><text id="pct-2" x="495.0" y="374.0" text-anchor="middle" class="mc-t2">-</text></g><g id="leaf-3" class="mc-purple"><rect x="270.0" y="402.0" width="140" height="52" rx="4"></rect><text x="340.0" y="422.0" text-anchor="middle">line @ 8.01 keV</text><text id="pct-3" x="340.0" y="440.0" text-anchor="middle" class="mc-t2">-</text></g>
</svg>

<div class="mc-legend"><span>zone_probs from the loaded checkpoint's config</span></div>
</div>

<script>
(function() {
  const DATA = {"types": ["gamma", "e-"], "typeProbs": [99.2686, 0.7314], "zones": [[99.597001, 0.391001, 0.005377, 0.006623], [99.999666, 0.000334, 0.0, 0.0]]};
  function fmt(p) {
    if (p >= 1) return p.toFixed(2) + '%';
    if (p >= 0.01) return p.toFixed(3) + '%';
    if (p > 0) return p.toFixed(4) + '%';
    return '0%';
  }
  function select(idx) {
    const row = DATA.zones[idx];
    row.forEach((v, j) => {
      const el = document.getElementById('pct-' + j);
      if (el) el.textContent = fmt(v);
      const leaf = document.getElementById('leaf-' + j);
      if (leaf && j > 0) leaf.style.opacity = v > 0.02 ? 1 : 0.4;
    });
    DATA.types.forEach((t, i) => {
      const cell = document.getElementById('cell-' + i);
      const wire = document.getElementById('wire-' + i);
      const active = i === idx;
      if (cell) cell.style.opacity = active ? 1 : 0.35;
      if (wire) {
        wire.setAttribute('stroke', active ? 'var(--circuit-accent)' : 'var(--circuit-border)');
        wire.setAttribute('stroke-width', active ? 2.5 : 1);
      }
    });
    document.querySelectorAll('.mc-btn').forEach(b => {
      const active = Number(b.dataset.idx) === idx;
      b.style.borderColor = active ? 'var(--circuit-accent)' : '';
      b.style.background = active ? 'var(--circuit-surface-1)' : '';
    });
  }
  document.querySelectorAll('.mc-btn').forEach(b =>
    b.addEventListener('click', () => select(Number(b.dataset.idx))));
  select(0);
})();
</script>

</body></html>
